name: DeleteMeFast CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Security dependency gate
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); const v=p.dependencies?.next || ''; if (v === '16.0.0' || v.startsWith('15.') && v !== '15.5.24') { console.error('Unsupported/vulnerable Next.js dependency declaration:', v); process.exit(1); }"
          npm audit --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify public surface does not expose internal architecture
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=.git --exclude='ARCHITECTURE.md' --exclude='MEGA_KERNEL.md' --exclude='*.map' \
            'FOUNDER CONTROL PLANE|SYSTEM ARCHITECTURE|SECURITY CONTROL PLANE|private system territory|what.s protected|what.s not|internal architecture|economic algorithms|agent topology' \
            app; then
            echo 'Internal architecture language detected in the public application surface.' >&2
            exit 1
          fi
      - name: Verify production claims are evidence-backed in source
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=.git --exclude='*.md' \
            '12,842|8,491|214,732\\.16|247|\\$0\\.0[1-9] / request' \
            app lib; then
            echo 'Fabricated dashboard metrics detected.' >&2
            exit 1
          fi
      - name: Verify DeleteMeFast domain identity
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=.git 'auraxhero\\.com|www\\.auraxhero\\.com|auraherox\\.com|www\\.auraherox\\.com|marketrail\\.app|www\\.marketrail\\.app|brindlewick\\.site|www\\.brindlewick\\.site' app lib README.md; then
            echo 'Cross-project or obsolete production domain reference detected in the DeleteMeFast application surface.' >&2
            exit 1
          fi
          if ! grep -RniE 'www\\.deletemefast\\.com' README.md app lib docs; then
            echo 'Canonical DeleteMeFast production domain is missing.' >&2
            exit 1
          fi
