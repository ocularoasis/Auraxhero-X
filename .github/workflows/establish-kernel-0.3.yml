name: Establish Kernel 0.3

on:
  push:
    branches:
      - establish-kernel-0.3

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure unzip and jq are available
        run: sudo apt-get update && sudo apt-get install -y unzip jq

      - name: Make scripts executable
        run: |
          chmod +x scripts/establish_kernel_0_3.sh

      - name: Run kernel establishment script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/establish_kernel_0_3.sh

      - name: Report status
        run: echo "Kernel 0.3 establishment workflow completed. If the script succeeded it has committed the canonical tree to this branch. See commit history for details."
