name: Establish Kernel 0.3 (manual, non-recursive)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit verified canonical source to establish-kernel-0.3"
        required: true
        default: "no"

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip jq coreutils file

      - name: Make script executable
        run: chmod +x scripts/establish_kernel_0_3.sh

      - name: Run establishment script
        env:
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          ./scripts/establish_kernel_0_3.sh

      - name: Upload report and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-establish-report
          path: |
            .kernel_establish_report.json
            historical-excluded/index.json
            .provenance/manifest.json

      - name: Complete
        run: echo "Establishment workflow finished. Artifacts uploaded. If commit=yes and all verification passed, the canonical tree is committed to this branch."
